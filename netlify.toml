# Netlify build + deploy config. Connecting the Netlify account/site is the
# human-gated tail of issue #5; this file makes the deploy turnkey once linked.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the pinned Node from the container / .nvmrc.
  NODE_VERSION = "22.12.0"

# Long-cache the immutable, hashed build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
